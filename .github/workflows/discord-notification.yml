name: Discord Notification

on:
  workflow_run:
    workflows: ["Generate Image"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le message du commit
        id: commit
        run: echo "message=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT

      - name: Télécharger l'artefact
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Envoyer notification Discord
        run: |
          IMAGE_NAME=$(ls ./artifacts | head -n 1)
          IMAGE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/images/$IMAGE_NAME"
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Nouveau commit : ${{ steps.commit.outputs.message }}\", \"embeds\": [{\"image\": {\"url\": \"$IMAGE_URL\"}}]}"
