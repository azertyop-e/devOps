name: Ex. 02 — Generate Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer le dossier images
        shell: bash
        run: mkdir -p images

      - name: Récupérer message du dernier commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          commit_message="$(git log -1 --pretty=%B | tr -d '\r')"
          delim="DELIM_${GITHUB_SHA}_${RANDOM}"
          {
            echo "message<<${delim}"
            printf '%s\n' "$commit_message"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Appeler l'API DynaPictures et télécharger l'image
        env:
          DYNA_API_KEY: ${{ secrets.DYNAPICTURES_API_KEY }}
          DYNA_TEMPLATE_UID: ${{ secrets.DYNAPICTURES_TEMPLATE_UID }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DYNA_API_KEY}" ] || [ -z "${DYNA_TEMPLATE_UID}" ]; then
            echo "Secrets manquants: DYNAPICTURES_API_KEY et/ou DYNAPICTURES_TEMPLATE_UID"
            exit 1
          fi

          sha="${GITHUB_SHA}"
          image_file="images/${sha}.png"
          meta_file="images/${sha}.txt"
          commit_title="$(printf '%s\n' "${COMMIT_MESSAGE}" | head -n1 | sed -e 's/[[:space:]]*$//')"
          coupon_code="$(printf '%s' "${sha}" | cut -c1-7 | tr '[:lower:]' '[:upper:]')"

          echo "Message du commit : ${COMMIT_MESSAGE}"
          echo "Template UID      : ${DYNA_TEMPLATE_UID}"
          echo "mockup_name_2     : ${commit_title}"
          echo "mockup_coupon_4   : ${coupon_code}"

          payload="$(jq -n \
            --arg format "png" \
            --arg name_text "${commit_title}" \
            --arg coupon_text "${coupon_code}" \
            '{format:$format, params:[
              {name:"mockup_name_2", text:$name_text},
              {name:"mockup_coupon_4", text:$coupon_text}
            ]}')"

          echo "Payload envoyé : ${payload}"

          url="https://api.dynapictures.com/designs/${DYNA_TEMPLATE_UID}"
          response="$(curl -sS -X POST "$url" \
            -H "Authorization: Bearer ${DYNA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload")"

          echo "Réponse API : ${response}"

          image_url="$(echo "$response" | jq -r '.imageUrl // .url // empty')"
          if [ -z "$image_url" ] || [ "$image_url" = "null" ]; then
            echo "Erreur : imageUrl absent de la réponse."
            exit 1
          fi

          echo "Téléchargement de l'image : $image_url"
          curl -sS -L --fail "$image_url" -o "$image_file"
          echo "Image sauvegardée : $image_file"
          echo "$COMMIT_MESSAGE" > "$meta_file"

      - name: Générer index.html (toutes les images)
        shell: bash
        run: |
          set -euo pipefail

          escape_html() {
            printf '%s' "$1" | sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g' \
              -e 's/"/\&quot;/g' \
              -e "s/'/\&#39;/g" | tr '\n' '<br/>'
          }

          mapfile -t pngs < <(ls -1 images/*.png 2>/dev/null | sort || true)
          figures=""
          for ((i=${#pngs[@]}-1; i>=0; i--)); do
            png="${pngs[$i]}"
            sha="$(basename "$png" .png)"
            txt="images/${sha}.txt"
            msg=""
            if [ -f "$txt" ]; then
              msg="$(cat "$txt" | tr -d '\r' | sed -e 's/[[:space:]]*$//')"
            fi

            img_src="$(basename "$png")"
            esc_msg="$(escape_html "$msg")"
            figures="${figures}<figure><img src=\"${img_src}\" alt=\"${esc_msg}\" style=\"max-width: 600px; width: 100%; height: auto;\" /><figcaption>${esc_msg}</figcaption></figure>"
          done

          cat > images/index.html <<EOF
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Images générées</title>
          </head>
          <body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 2rem;">
            <h1>Images générées</h1>
            <p>D'après les messages de commit.</p>
            ${figures}
          </body>
          </html>
          EOF

      - name: Committer et pousser l'image dans le repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git diff --cached --quiet && echo "Rien à committer" && exit 0
          git commit -m "chore: image générée pour le commit ${GITHUB_SHA::7}"
          git push

      - name: Upload artefact image-generee
        uses: actions/upload-artifact@v4
        with:
          name: image-generee
          path: images/${{ github.sha }}.png

      - name: Déployer sur InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./images/
          server-dir: /htdocs/images/

      - name: Afficher l'URL du site
        shell: bash
        run: echo "Site http://devops.freepage.cc/images/index.html"
