name: Artifact Demo

on:
  push:
    branches:
      - main

jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repository
        uses: actions/checkout@v4

      - name: Générer un fichier
        run: echo "Bonjour, je suis un workflow qui génère un fichier"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: readme-artifact
          path: README.md

  download-artifact:
    runs-on: ubuntu-latest
    needs: upload-artifact
    steps:
      - name: Checkout du repository
        uses: actions/checkout@v4

      - name: Télécharger l'artefact
        uses: actions/download-artifact@v4
        with:
          name: readme-artifact
          path: ./downloaded
