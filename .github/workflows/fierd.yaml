name: Generate File

on: 
  push: 
    branches:
      - main

jobs:
  generateFile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repository
        uses: actions/checkout@v4
      
      - name: Générer un fichier
        run: echo "Bonjour, je suis un workflow qui génère un fichier"
      
      - name: Arctefact 
        uses: actions/upload-artifact@v4
        with:
          name: README.md
          path: README.md

  useArtifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repository
        uses: actions/checkout@v4
      
      - name: Télécharger l'artefact
        uses: actions/download-artifact@v4
        with:
          name: README.md
          path: README.md
     