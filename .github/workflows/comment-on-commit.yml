name: Comment on Commit

on:
  workflow_run:
    workflows: ["Generate Image"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger l'artefact
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Poster un commentaire sur le commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifacts = fs.readdirSync('./artifacts');
            const imageName = artifacts[0];
            const imageUrl = `http://devops.freepage.cc/images/${imageName}`;
            const commitMsg = (await exec.getExecOutput('git log -1 --pretty=%B')).stdout.trim();
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `**Commit :** ${commitMsg}\n\n![image](${imageUrl})`
            });
